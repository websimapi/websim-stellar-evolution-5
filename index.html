<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar Evolution</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "react": "https://unpkg.com/react@18/umd/react.production.min.js",
        "react-dom": "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="game">
    <div id="output-container">
      <div id="output"></div>
    </div>
    <div id="status-bar">
      <div class="resource" id="energy">
        <span class="icon">⚡</span>
        <span class="value">0</span>
      </div>
      <div class="resource" id="minerals">
        <span class="icon">🪨</span>
        <span class="value">0</span>
      </div>
      <div class="resource" id="knowledge">
        <span class="icon">🧠</span>
        <span class="value">0</span>
      </div>
      <div class="resource" id="population">
        <span class="icon">👤</span>
        <span class="value">0</span>
      </div>
    </div>
    <div id="input-container">
      <input type="text" id="command-input" placeholder="Enter command (e.g., 'explore nearby space')">
      <button id="submit-button">Send</button>
    </div>
    <div id="save-controls">
      <button id="save-game">Save Game</button>
      <button id="load-game">Load Game</button>
    </div>
  </div>
  <script src="gameState.js"></script>
  <script src="commandParser.js"></script>
  <script src="gameManager.js"></script>
  <script src="main.js"></script>

</body>
</html>
